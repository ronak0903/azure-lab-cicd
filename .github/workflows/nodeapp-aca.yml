# Node.js -> Docker image -> ACR -> Azure Container Apps -> validate
name: nodeapp-aca

on:
  push:
    branches: [main]
    paths: ['node-app/**', '.github/workflows/nodeapp-aca.yml']
  workflow_dispatch:

env:
  ACR: acrlabcinx7k2
  IMAGE: nodeapp-gha
  RG: rg-lab-containers-cin
  APP: ca-lab-nodeapp-cin

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install and test
        working-directory: node-app
        run: |
          npm install
          npm test

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (service principal)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image to ACR
        run: |
          az acr login --name $ACR
          docker build -t $ACR.azurecr.io/$IMAGE:${{ github.run_number }} node-app
          docker push $ACR.azurecr.io/$IMAGE:${{ github.run_number }}

      - name: Deploy to Container Apps
        run: |
          az extension add --name containerapp --upgrade -y
          az containerapp update -n $APP -g $RG \
            --image $ACR.azurecr.io/$IMAGE:${{ github.run_number }} \
            --set-env-vars APP_VERSION=gha-${{ github.run_number }}

      - name: Validate deployment
        run: |
          FQDN=$(az containerapp show -n $APP -g $RG --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 15); do
            if curl -sf "https://$FQDN/health" | grep -q OK; then
              echo "PASSED: https://$FQDN"; curl -s "https://$FQDN/"; exit 0
            fi
            echo "attempt $i failed"; sleep 20
          done
          exit 1
